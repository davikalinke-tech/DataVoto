<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - DataVotoCesf</title>

    <!-- Tailwind CSS & Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen text-slate-800 bg-slate-50 antialiased">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b-4 border-amber-500">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-extrabold text-xl text-white">DataVoto<span class="text-amber-400">Admin</span></span>
            </div>
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-white">
                <i class="fa-solid fa-arrow-left mr-1"></i> Ir para o Formulário
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        
        <!-- CARD DE LOGIN -->
        <div id="admin-auth" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <i class="fa-solid fa-lock text-3xl text-blue-600 mb-2"></i>
                <h2 class="text-xl font-bold text-slate-900">Acesso Restrito</h2>
                <p class="text-xs text-slate-500">Digite a senha (Padrão: <b>admin123</b>)</p>
            </div>
            <form onsubmit="autenticarAdmin(event)" class="space-y-4">
                <input type="password" id="senhaAdmin" placeholder="Digite a senha..." required class="w-full rounded-xl border p-3 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-blue-600">
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition-all">
                    Entrar no Painel
                </button>
            </form>
        </div>

        <!-- CONTEÚDO DO DASHBOARD (OCULTO ATÉ O LOGIN) -->
        <div id="dashboard-content" class="hidden space-y-8">
            
            <!-- MÉTRICAS PRINCIPAIS -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
                    <span class="text-xs font-bold text-slate-400 uppercase">Total de Respostas</span>
                    <div id="stat-total" class="text-3xl font-extrabold text-slate-900 mt-1">0</div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
                    <span class="text-xs font-bold text-slate-400 uppercase">Média de Moradores</span>
                    <div id="stat-moradores" class="text-3xl font-extrabold text-blue-600 mt-1">0.0</div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
                    <span class="text-xs font-bold text-slate-400 uppercase">Média de Trabalhadores</span>
                    <div id="stat-trabalhadores" class="text-3xl font-extrabold text-emerald-600 mt-1">0.0</div>
                </div>
            </div>

            <!-- PAINEL DE GRÁFICOS -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-700 mb-4">Certeza do Voto</h3>
                    <canvas id="chartVoto"></canvas>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-700 mb-4">Pautas Prioritárias</h3>
                    <canvas id="chartPautas"></canvas>
                </div>
            </div>

        </div>
    </main>

    <script>
        let chartVotoInstance = null;
        let chartPautasInstance = null;

        function autenticarAdmin(e) {
            e.preventDefault();
            const senha = document.getElementById('senhaAdmin').value;
            if (senha === 'admin123') {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                carregarDashboard();
            } else {
                alert('Senha incorreta!');
            }
        }

        function carregarDashboard() {
            const respostas = JSON.parse(localStorage.getItem('datavoto_respostas') || '[]');
            
            // Atualizar Métricas
            document.getElementById('stat-total').innerText = respostas.length;
            
            if (respostas.length > 0) {
                const totalMoradores = respostas.reduce((acc, curr) => acc + curr.moradores, 0);
                const totalTrabalhadores = respostas.reduce((acc, curr) => acc + curr.trabalhadores, 0);
                
                document.getElementById('stat-moradores').innerText = (totalMoradores / respostas.length).toFixed(1);
                document.getElementById('stat-trabalhadores').innerText = (totalTrabalhadores / respostas.length).toFixed(1);
            }

            // Gráfico Certeza do Voto
            const votos = {};
            respostas.forEach(r => votos[r.certezaVoto] = (votos[r.certezaVoto] || 0) + 1);

            if (chartVotoInstance) chartVotoInstance.destroy();
            chartVotoInstance = new Chart(document.getElementById('chartVoto'), {
                type: 'pie',
                data: {
                    labels: Object.keys(votos),
                    datasets: [{ data: Object.values(votos), backgroundColor: ['#2563eb', '#f59e0b', '#ef4444'] }]
                }
            });

            // Gráfico Pautas
            const pautas = {};
            respostas.forEach(r => r.pautas.forEach(p => pautas[p] = (pautas[p] || 0) + 1));

            if (chartPautasInstance) chartPautasInstance.destroy();
            chartPautasInstance = new Chart(document.getElementById('chartPautas'), {
                type: 'bar',
                data: {
                    labels: Object.keys(pautas),
                    datasets: [{ label: 'Votos', data: Object.values(pautas), backgroundColor: '#0f172a' }]
                }
            });
        }
    </script>
</body>
</html>
